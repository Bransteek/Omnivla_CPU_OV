services:
  omnivla-brain:
    build: .
    container_name: omnivla_ros2
    network_mode: "host"
    ipc: host       
    pid: host       
    volumes:
      - .:/app
      - model_cache:/root/.cache
    environment:
      - DISPLAY=${DISPLAY}
      - TURTLEBOT3_MODEL=waffle
    command: python3 inference/bridge_gazebo.py

  gazebo-sim:
      build: .
      container_name: gazebo_sim
      network_mode: "host"
      ipc: host       
      pid: host       
      environment:
        - DISPLAY=${DISPLAY}
        - TURTLEBOT3_MODEL=waffle
        - LIBGL_ALWAYS_SOFTWARE=1
      volumes:
        - /tmp/.X11-unix:/tmp/.X11-unix
        - .:/app
        # Mantenemos el truco de la magia del volumen que SÍ funcionaba
        - ./omnivla_shapes.world:/opt/ros/humble/share/turtlebot3_gazebo/worlds/empty_world.world
      # Volvemos al comando nativo que hace todo automáticamente
      command: ros2 launch turtlebot3_gazebo empty_world.launch.py
volumes:
  model_cache: